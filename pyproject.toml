[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fastrp"
version = "0.1.1"
description = "A high-performance safe implementation of the Fast Random Projection (FastRP) algorithm."
readme = "fastrp-py/README.md"
requires-python = ">=3.8"
authors = [
    { name = "Federico Argilli" }
]
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/Fedeshadow/FastRP-rs"
Repository = "https://github.com/Fedeshadow/FastRP-rs"
Documentation = "https://github.com/Fedeshadow/FastRP-rs"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "scipy>=1.5.0",
]
sparse = [
    "scipy>=1.5.0",
]


[tool.maturin]
manifest-path = "fastrp-py/Cargo.toml"
python-source = "fastrp-py/python"
module-name = "fastrp._rust_core"
