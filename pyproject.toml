[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fastrp"
version = "0.1.0"
description = "A high-performance safe implementation of the Fast Random Projection (FastRP) algorithm."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.16.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "scipy>=1.5.0",
]


[tool.maturin]
manifest-path = "fastrp-py/Cargo.toml"
python-source = "fastrp-py/python"
module-name = "fastrp._rust_core"
